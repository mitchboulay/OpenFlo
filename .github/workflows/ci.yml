name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      # Runs gen:api and the OpenAPI type drift check (active here: this is a git checkout).
      - run: npm run build

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t openflo:ci .
      - name: Smoke test (read-only rootfs, healthz, SPA)
        run: |
          docker run -d --name openflo-ci -p 127.0.0.1:18099:8099 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges openflo:ci
          for _ in $(seq 1 30); do curl -fsS 127.0.0.1:18099/healthz && break; sleep 1; done
          curl -fsS 127.0.0.1:18099/healthz
          curl -fsS 127.0.0.1:18099/ | grep -q '<title>OpenFLO</title>'
          docker image inspect openflo:ci --format 'image size: {{.Size}} bytes'
      - name: Container logs on failure
        if: failure()
        run: docker logs openflo-ci
      - name: Validate deploy/Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e OPENFLO_DOMAIN=example.com -e OPENFLO_HTTPS_PORT=443 -e OPENFLO_ACME_EMAIL=ci@example.com \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          CLOUDFLARE_API_TOKEN=ci docker compose -f compose.yaml -f compose.dns01.yaml config --quiet
