name: Cloudflare ranges

# The address check (AD-9) warns when the server address resolves into Cloudflare's ranges, read from the
# vendored backend/app/cloudflare_ranges.json. This job fails when Cloudflare publishes new ranges; run
# `python tools/refresh_cloudflare_ranges.py` and commit the result.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python tools/refresh_cloudflare_ranges.py
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- backend/app/cloudflare_ranges.json; then
            echo "::error::Cloudflare's IP ranges changed; run tools/refresh_cloudflare_ranges.py and commit"
            exit 1
          fi
