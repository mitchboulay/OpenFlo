# OpenFLO lab DHCP + DNS. Serves eth1 (VLAN 30) only; nftables admits nothing else.
# No manufacturer-domain overrides: vendor names always resolve upstream.
interface=eth1
bind-dynamic

# Upstream: public resolvers, not Pi-hole, so production blocklists cannot alter the baseline.
no-resolv
no-poll
server=1.1.1.1
server=9.9.9.9
domain-needed
bogus-priv

domain=lab.openflo
local=/lab.openflo/

# OpenFLO backend: this container's Caddy on this VLAN (Mission 008A). Device sends A queries only.
address=/openflo-backend.home.example.com/192.168.30.1
# OpenFLO public address, straight to the OpenFLO host on the LAN (no hairpin through the router). Used once a device
# is provisioned with https://openflo.example.com (task T2.1); nftables lab_to_openflo admits the flow.
address=/openflo.example.com/192.168.1.40

dhcp-range=192.168.30.50,192.168.30.99,255.255.255.0,12h
# iFLO under test: nftables and the backend allowlists key on this address.
dhcp-host=68:67:25:00:00:01,192.168.30.80
dhcp-option=option:router,192.168.30.1
dhcp-option=option:dns-server,192.168.30.1
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Logging: every query, reply and DHCP exchange, to a file the capture script tails. Timestamps are UTC (container timezone).
log-queries=extra
log-dhcp
log-facility=/var/log/openflo/dnsmasq.log
log-async=50
