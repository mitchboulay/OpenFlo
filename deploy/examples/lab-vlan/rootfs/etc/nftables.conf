#!/usr/sbin/nft -f
# OpenFLO lab gateway (openflo-gw, the gateway container).
#   eth0 = production LAN uplink, 192.168.1.30/24 (default route via the router)
#   eth1 = lab, VLAN 30, 192.168.30.1/24 (the only gateway on this VLAN)
# Policy: lab -> public internet only (NAT), plus TLS to OpenFLO on the OpenFLO host. Lab -> anything else private,
# the router, or IPv6: dropped.
# LAN -> lab: only the analyst workstation. Lab -> gateway: DHCP, DNS, ping, and the iFLO -> TLS listener.
# Everything else: dropped.

flush ruleset

define LAB_NET = 192.168.30.0/24
define LAB_GW  = 192.168.30.1
define LAN_NET = 192.168.1.0/24
# Analyst workstation. Placeholder: set to yours and re-run gateway-apply.
define ANALYST = 192.168.1.50
# The iFLO under test (dynamic lease, stable since provisioning). Matched on MAC and IP: neither is
# authentication, but together they keep every other lab host off the backend listener.
define IFLO_MAC = 68:67:25:00:00:01
define IFLO_IP  = 192.168.30.80
# LAN reverse proxy allowed to reach the backend and controller ports.
define CADDY_CT = 192.168.1.10
# OpenFLO on the OpenFLO host: the device path (this container's Caddy proxies to it) and the public listener.
define OPENFLO_CT = 192.168.1.40
# Never reachable from the lab: RFC1918, CGNAT, loopback, link-local, documentation/benchmark ranges,
# multicast/reserved, and our own WAN address (hairpin into the router's services; placeholder, set to yours).
define NO_GO = {
  0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12,
  192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24,
  203.0.113.0/24, 224.0.0.0/3, 203.0.113.10
}

table inet openflo {
  counter lab_dhcp {}
  counter lab_dns {}
  counter lab_device_tls {}
  counter lab_to_gw_blocked {}
  counter lab_to_private_blocked {}
  counter lab_to_wan {}
  counter lab_to_openflo {}
  counter lab_v6_blocked {}
  counter analyst_to_lab {}
  counter lan_to_gw_blocked {}
  counter forward_other_blocked {}

  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    meta nfproto ipv6 counter name lab_v6_blocked drop
    ct state invalid drop
    ct state established,related accept
    iifname "eth1" udp sport 68 udp dport 67 counter name lab_dhcp accept
    iifname "eth1" ip daddr $LAB_GW meta l4proto { tcp, udp } th dport 53 counter name lab_dns accept
    iifname "eth1" ip daddr $LAB_GW icmp type echo-request accept
    iifname "eth1" ether saddr $IFLO_MAC ip saddr $IFLO_IP ip daddr $LAB_GW tcp dport 443 counter name lab_device_tls accept
    iifname "eth1" counter name lab_to_gw_blocked drop
    iifname "eth0" ip saddr $LAN_NET icmp type echo-request accept
    iifname "eth0" ip saddr $CADDY_CT tcp dport { 8080, 8099 } accept
    counter name lan_to_gw_blocked drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    meta nfproto ipv6 counter name lab_v6_blocked drop
    ct state invalid drop
    ct state established,related accept
    iifname "eth1" oifname "eth0" ip saddr $LAB_NET ip daddr $OPENFLO_CT tcp dport 443 counter name lab_to_openflo accept
    iifname "eth1" oifname "eth0" ip saddr $LAB_NET ip daddr $NO_GO counter name lab_to_private_blocked drop
    iifname "eth1" oifname "eth0" ip saddr $LAB_NET counter name lab_to_wan accept
    iifname "eth0" oifname "eth1" ip saddr $ANALYST ip daddr $LAB_NET counter name analyst_to_lab accept
    counter name forward_other_blocked drop
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname "eth0" ip saddr $LAB_NET masquerade
  }
}
